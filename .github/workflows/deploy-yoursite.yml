name: Deploy yoursite.asia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/aliyun-*.sh"
      - "server/emergency.cjs"
      - ".github/workflows/deploy-yoursite.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.YS_SSH_KEY_B64 }}
          KEY_RAW: ${{ secrets.YS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | tr -d '\r\n ' | base64 -d > deploy_key
          elif [ -n "$KEY_RAW" ]; then
            printf '%s\n' "$KEY_RAW" > deploy_key
          else
            echo "Missing YS_SSH_KEY or YS_SSH_KEY_B64"
            exit 1
          fi
          chmod 600 deploy_key
          ssh-keygen -y -f deploy_key > /dev/null
          echo "SSH key format OK"

      - name: Restore yoursite.asia over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.YS_SSH_HOST }}
          username: ${{ secrets.YS_SSH_USER }}
          key_path: deploy_key
          port: ${{ secrets.YS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            curl -fsSL "https://cdn.jsdelivr.net/gh/leedh994-a11y/leedh994-a11y.github.io@main/scripts/aliyun-disk-cleanup.sh" | bash
            export PAYPAL_CLIENT_SECRET="${{ secrets.YS_PAYPAL_CLIENT_SECRET }}"
            export SMTP_PASS="${{ secrets.YS_SMTP_PASS }}"
            curl -fsSL "https://cdn.jsdelivr.net/gh/leedh994-a11y/leedh994-a11y.github.io@main/scripts/aliyun-full-restore.sh" | bash
            echo "--- verify ---"
            curl -s -o /dev/null -w "local %{http_code}\n" http://127.0.0.1:3000/ || true
            curl -s -o /dev/null -w "local3456 %{http_code}\n" http://127.0.0.1:3456/ || true
            curl -s -o /dev/null -w "public %{http_code}\n" https://yoursite.asia/ || true
