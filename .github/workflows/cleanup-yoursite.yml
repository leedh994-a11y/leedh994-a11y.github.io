name: Cleanup yoursite.asia disk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/aliyun-disk-cleanup.sh"
      - ".github/workflows/cleanup-yoursite.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.YS_SSH_KEY_B64 }}
          KEY_RAW: ${{ secrets.YS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | tr -d '\r\n ' | base64 -d > deploy_key
          elif [ -n "$KEY_RAW" ]; then
            printf '%s\n' "$KEY_RAW" > deploy_key
          else
            echo "Missing YS_SSH_KEY or YS_SSH_KEY_B64"
            exit 1
          fi
          chmod 600 deploy_key
          ssh-keygen -y -f deploy_key > /dev/null
          echo "SSH key format OK"

      - name: Run disk cleanup on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.YS_SSH_HOST }}
          username: ${{ secrets.YS_SSH_USER }}
          key_path: deploy_key
          port: ${{ secrets.YS_SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            curl -fsSL "https://cdn.jsdelivr.net/gh/leedh994-a11y/leedh994-a11y.github.io@main/scripts/aliyun-disk-cleanup.sh" | bash
