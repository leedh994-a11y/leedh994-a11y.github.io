services:
  - type: web
    name: pzhisen
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PUBLIC_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_CEO_MODEL
        value: anthropic/claude-sonnet-4
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: Pzhisen
      - key: DATA_DIR
        value: /tmp/pzhisen-data
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_BRANCH
        sync: false
      - key: BANK_LABEL
        value: 中国银行借记卡
      - key: BANK_VISA_SAME_AS_PRIMARY
        value: "true"
      - key: BANK_VISA_LABEL
        value: Visa 借记卡（同中国银行卡）
      - key: BILLING_ADMIN_SECRET
        sync: false
      - key: ORDER_NOTIFY_EMAIL
        value: LeeDh994@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_NOTIFY_TOKEN
        sync: false
      - key: GITHUB_NOTIFY_REPO
        value: leedh994-a11y/leedh994-a11y.github.io
      - key: MAIL_RELAY_URL
        value: https://yoursite.asia/api/mail/send
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
